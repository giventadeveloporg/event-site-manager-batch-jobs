name: Deploy to Dev

# Triggered on push to any branch, or manually (workflow_dispatch).

on:
  push:
    # Avoid racing Deploy to Production when release/v1.0.0 is pushed
    # (both workflows were targeting DEV concurrently and triggering circuit-breaker rollbacks).
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

env:
  # ECS/ECR/ECS deploy region (override via vars.AWS_DEPLOY_REGION if needed)
  AWS_DEPLOY_REGION: ${{ vars.AWS_DEPLOY_REGION || 'us-east-1' }}
  # S3/SES runtime region injected into the container (matches application.yml default)
  AWS_S3_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  # Set ECR_REPOSITORY_DEV in GitHub environment variables to match the repo in AWS ECR
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_DEV || 'event-site-manager-batch-jobs-dev' }}
  ECS_SERVICE: event-site-manager-dev-batch-jobs-service
  ECS_CLUSTER: event-site-manager-dev-cluster
  ECS_TASK_DEFINITION: event-site-manager-dev-batch-jobs
  # Must match the container "name" in the ECS task definition in AWS (see task definition JSON in ECS console)
  CONTAINER_NAME: batch-jobs-service

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository exists
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "::error::ECR_REPOSITORY is empty. Set ECR_REPOSITORY_DEV in the dev environment variables."
            exit 1
          fi
          echo "Checking ECR repository '$ECR_REPOSITORY' in region '${{ env.AWS_DEPLOY_REGION }}'..."
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "${{ env.AWS_DEPLOY_REGION }}" >/dev/null 2>&1; then
            echo "::error::ECR repository '$ECR_REPOSITORY' was not found in account/region ${{ env.AWS_DEPLOY_REGION }}."
            echo "Create the repository in AWS ECR or set ECR_REPOSITORY_DEV to the existing repository name."
            exit 1
          fi
          echo "ECR repository '$ECR_REPOSITORY' exists."

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json
          echo "Container names in task definition:"
          cat task-definition.json | jq -r '.containerDefinitions[].name'

      # Keep runtime env minimal. Prefer ECS task role for AWS API access —
      # do NOT inject AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into the container.
      - name: Keep task definition runtime env minimal
        env:
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        run: |
          NAMES=$(jq -r '.containerDefinitions[].name' task-definition.json)
          echo "Container names in task definition: $NAMES"
          if ! echo "$NAMES" | grep -qx "$CONTAINER_NAME"; then
            echo "::error::CONTAINER_NAME='$CONTAINER_NAME' does not match any container in the task definition ($NAMES)."
            exit 1
          fi
          jq --arg container "$CONTAINER_NAME" \
             --arg region "${{ env.AWS_S3_REGION }}" \
             --arg bucket "$AWS_S3_BUCKET_NAME" \
             '
             .containerDefinitions = [
               .containerDefinitions[] |
               if .name == $container then
                 .environment = (
                   ((.environment // []) | map(select(
                     .name != "AWS_REGION" and
                     .name != "AWS_S3_BUCKET_NAME"
                   ))) +
                   [
                     {"name": "AWS_REGION", "value": $region}
                   ] +
                   (if ($bucket | length) > 0 then [{"name": "AWS_S3_BUCKET_NAME", "value": $bucket}] else [] end)
                 )
               else .
               end
             ]
             ' task-definition.json > task-definition-updated.json
          mv task-definition-updated.json task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment
        run: |
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Deployment verified successfully!"

      - name: Dump ECS service events on failure
        if: failure()
        run: |
          echo "=== Recent service events ==="
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].events[0:20].[createdAt,message]' \
            --output table || true
          echo "=== Recent STOPPED tasks ==="
          STOPPED=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "${{ env.ECS_SERVICE }}" \
            --desired-status STOPPED \
            --query 'taskArns[0:5]' \
            --output text)
          if [ -n "$STOPPED" ] && [ "$STOPPED" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --tasks $STOPPED \
              --query 'tasks[].{arn:taskArn,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason,health:healthStatus}}' \
              --output json || true
          fi
          echo "=== Tip: CloudWatch /ecs/${{ env.ECS_TASK_DEFINITION }} — look for Schema-validation / Application failed to start ==="
